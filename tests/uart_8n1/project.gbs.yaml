name: uart_8n1

root:
  name: top
  deps:
    - nsl_simulation.fifo
    - nsl_simulation.driver
    - nsl_uart.serdes
    - nsl_clocking.async
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

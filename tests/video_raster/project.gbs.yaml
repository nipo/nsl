name: video_raster

root:
  name: top
  deps:
    - nsl_video.mode
    - nsl_video.pixel_stream
    - nsl_video.raster
    - nsl_color.rgb
    - nsl_simulation.driver
    - nsl_data.text
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

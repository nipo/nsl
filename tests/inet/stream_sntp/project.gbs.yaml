name: inet_stream_sntp

root:
  name: top
  deps:
    - nsl_data.bytestream
    - nsl_data.endian
    - nsl_data.text
    - nsl_simulation.assertions
    - nsl_simulation.logging
    - nsl_simulation.driver
    - nsl_amba.axi4_stream
    - nsl_math.int_ext
    - nsl_inet.ipv4
    - nsl_inet.stream
    - nsl_inet.stream_ipv4
    - nsl_inet.stream_udp
    - nsl_inet.stream_sntp
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

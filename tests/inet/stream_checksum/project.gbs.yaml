name: inet_stream_checksum

root:
  name: top
  deps:
    - nsl_data.bytestream
    - nsl_data.prbs
    - nsl_data.text
    - nsl_simulation.assertions
    - nsl_simulation.logging
    - nsl_simulation.driver
    - nsl_amba.axi4_stream
    - nsl_inet.stream
    - nsl_inet.checksum
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

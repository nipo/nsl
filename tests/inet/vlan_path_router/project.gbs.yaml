name: inet_vlan_path_router

root:
  name: top
  deps:
    - nsl_bnoc.committed
    - nsl_bnoc.testing
    - nsl_data.bytestream
    - nsl_data.crc
    - nsl_data.endian
    - nsl_data.text
    - nsl_inet.vlan
    - nsl_inet.mac
    - nsl_simulation.driver
    - nsl_simulation.logging
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

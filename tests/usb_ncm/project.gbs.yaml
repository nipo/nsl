name: usb_ncm

root:
  name: tb
  deps:
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_simulation.logging
    - nsl_simulation.driver
    - nsl_amba.axi4_stream
    - nsl_bnoc.committed
    - nsl_bnoc.framed
    - nsl_bnoc.pipe
    - nsl_inet.stream
    - nsl_math.int_ext
    - nsl_logic.bool
    - nsl_usb.ncm
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

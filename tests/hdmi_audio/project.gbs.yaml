name: hdmi_audio

root:
  name: top
  deps:
    - nsl_video.pattern
    - nsl_video.colormap
    - nsl_dvi.decoder
    - nsl_dvi.dvi
    - nsl_hdmi.encoder
    - nsl_hdmi.decoder
    - nsl_hdmi.hdmi
    - nsl_hdmi.audio
    - nsl_hdmi.audio_stream
    - nsl_audio.pcm
    - nsl_audio.pcm_stream
    - nsl_amba.axi4_stream
    - nsl_spdif.blocker
    - nsl_video.mode
    - nsl_video.pixel_stream
    - nsl_color.rgb
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_simulation.driver
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

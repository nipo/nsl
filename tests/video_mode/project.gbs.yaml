name: video_mode

root:
  name: top
  deps:
    - nsl_video.mode
    - nsl_simulation.control
    - nsl_data.text
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

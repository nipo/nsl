name: audio_pcm_stream

root:
  name: top
  deps:
    - nsl_audio.pcm
    - nsl_audio.pcm_stream
    - nsl_amba.axi4_stream
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_simulation.control
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

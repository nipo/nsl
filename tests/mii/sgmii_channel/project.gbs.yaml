name: mii_sgmii_channel

root:
  name: top
  deps:
    - nsl_simulation.driver
    - nsl_simulation.logging
    - nsl_mii.sgmii
    - nsl_line_coding.ibm_8b10b
    - nsl_io.diff
    - nsl_data.text
  sources:
    - file_type: vhdl
      files:
        - src/bench.vhd
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

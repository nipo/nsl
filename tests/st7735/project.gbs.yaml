name: st7735

root:
  name: top
  deps:
    - nsl_sitronix.st7735
    - nsl_spi.spi
    - nsl_color.rgb
    - nsl_data.bytestream
    - nsl_simulation.control
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

name: hdmi_decoder

root:
  name: top
  deps:
    - nsl_video.pattern
    - nsl_video.colormap
    - nsl_dvi.decoder
    - nsl_dvi.dvi
    - nsl_hdmi.encoder
    - nsl_hdmi.decoder
    - nsl_hdmi.hdmi
    - nsl_video.mode
    - nsl_video.pixel_stream
    - nsl_color.rgb
    - nsl_line_coding.tmds
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_simulation.driver
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

name: video_palette_expander

root:
  name: top
  deps:
    - nsl_video.colormap
    - nsl_video.pixel_stream
    - nsl_color.rgb
    - nsl_simulation.control
  sources:
    - file_type: vhdl
      files:
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

name: altera_hps_atoms

root:
  name: top
  deps:
    - nsl_altera.hps
    - nsl_simulation.driver
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd
    - file_type: nsl-agilex5-hps
      files:
        - hps.yaml

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

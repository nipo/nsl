name: mau_10baset_back_to_back

root:
  name: top
  deps:
    - nsl_8023.mau_10baset
    - nsl_mii.flit
    - nsl_bnoc.committed
    - nsl_bnoc.testing
    - nsl_simulation.logging
    - nsl_simulation.control
    - nsl_data.bytestream
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

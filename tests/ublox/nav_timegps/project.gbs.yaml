name: ublox_nav_timegps

root:
  name: top
  deps:
    - nsl_data.bytestream
    - nsl_data.endian
    - nsl_simulation.assertions
    - nsl_simulation.logging
    - nsl_simulation.driver
    - nsl_ublox.ubx
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

name: video_vdma

root:
  name: top
  deps:
    - nsl_video.vdma
    - nsl_video.pixel_stream
    - nsl_amba.ram
    - nsl_amba.axi4_mm
    - nsl_amba.axi4_stream
    - nsl_simulation.driver
    - nsl_simulation.logging
    - nsl_data.text
    - nsl_data.bytestream
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

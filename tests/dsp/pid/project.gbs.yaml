name: dsp_pid

root:
  name: top
  deps:
    - nsl_math.fixed
    - nsl_dsp.pid
    - nsl_simulation.control
    - nsl_simulation.logging
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

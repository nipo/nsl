name: delay_line_variable

root:
  name: top
  deps:
    - nsl_dsp.delay_line
    - nsl_simulation.driver
  sources:
    - file_type: vhdl
      files:
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

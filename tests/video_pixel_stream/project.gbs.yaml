name: video_pixel_stream

root:
  name: top
  deps:
    - nsl_video.mode
    - nsl_video.pixel_stream
    - nsl_color.rgb
    - nsl_simulation.control
    - nsl_data.text
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

name: terminal_labels

root:
  name: top
  deps:
    - nsl_dvi.terminal
    - nsl_indication.font
    - nsl_indication.font_6x8
    - nsl_color.rgb
    - nsl_data.text
    - nsl_simulation.control
  sources:
    - file_type: vhdl
      files:
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

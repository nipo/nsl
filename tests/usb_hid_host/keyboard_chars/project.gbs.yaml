name: usb_hid_host_keyboard_chars

root:
  name: top
  deps:
    - nsl_usb.hid_host
    - nsl_amba.axi4_stream
    - nsl_data.bytestream
    - nsl_simulation.control
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

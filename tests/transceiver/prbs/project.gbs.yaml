name: transceiver_prbs

root:
  name: top
  deps:
    - nsl_simulation.driver
    - nsl_simulation.logging
    - nsl_transceiver.lane
    - nsl_transceiver.prbs
    - nsl_data.bytestream
    - nsl_data.prbs
  sources:
    - file_type: vhdl
      files:
        - src/prbs_bench.vhd
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

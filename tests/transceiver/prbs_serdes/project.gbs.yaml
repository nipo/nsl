name: transceiver_prbs_serdes

root:
  name: top
  deps:
    - nsl_transceiver.prbs
    - nsl_io.serdes
    - nsl_simulation.driver
    - nsl_simulation.logging
    - nsl_data.text
  sources:
    - file_type: vhdl
      files:
        - src/serdes_bench.vhd
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

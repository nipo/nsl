name: video_thumbnail

root:
  name: top
  deps:
    - nsl_video.raster
    - nsl_sitronix.st7735
    - nsl_spi.spi
    - nsl_video.pixel_stream
    - nsl_video.mode
    - nsl_amba.axi4_stream
    - nsl_amba.stream_fifo
    - nsl_data.text
    - nsl_simulation.driver
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

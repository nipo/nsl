name: i2c_transactor_stuck_abort

root:
  name: top
  deps:
    - nsl_i2c.transactor
    - nsl_i2c.clocked
    - nsl_i2c.i2c
    - nsl_bnoc.framed
    - nsl_bnoc.testing
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_simulation.driver
    - nsl_simulation.logging
    - nsl_clocking.async
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

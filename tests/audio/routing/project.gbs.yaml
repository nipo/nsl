name: audio_routing

root:
  name: top
  deps:
    - nsl_audio.routing
    - nsl_audio.metadata
    - nsl_audio.pcm
    - nsl_audio.pcm_stream
    - nsl_amba.axi4_stream
    - nsl_data.text
    - nsl_simulation.driver
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

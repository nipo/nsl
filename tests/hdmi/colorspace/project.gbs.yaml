name: hdmi_colorspace

root:
  name: top
  deps:
    - nsl_hdmi.hdmi
    - nsl_dvi.encoder
    - nsl_video.pixel_stream
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_simulation.control
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

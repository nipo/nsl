name: spi_chunked_link_loopback

root:
  name: top
  deps:
    - nsl_spi.chunked_link
    - nsl_spi.spi
    - nsl_bnoc.framed
    - nsl_bnoc.testing
    - nsl_data.bytestream
    - nsl_simulation.assertions
    - nsl_simulation.logging
    - nsl_simulation.driver
  sources:
    - file_type: vhdl
      files:
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

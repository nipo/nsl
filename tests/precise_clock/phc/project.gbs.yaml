name: precise_clock_local_offset

root:
  name: top
  deps:
   - nsl_simulation.assertions
   - nsl_simulation.logging
   - nsl_simulation.driver
   - nsl_math.fixed
   - nsl_math.timing
   - nsl_time.clock
   - nsl_time.timestamp
   - nsl_time.skew
  sources:
    - file_type: vhdl
      files:
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

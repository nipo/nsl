name: precise_clock_pps_latency

root:
  name: top
  deps:
   - nsl_simulation.driver
   - nsl_time.timestamp
   - nsl_time.discipline
   - nsl_time.pps
  sources:
    - file_type: vhdl
      files:
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

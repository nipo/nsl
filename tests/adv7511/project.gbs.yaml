name: adv7511

root:
  name: top
  deps:
    - nsl_adi.adv7511
    - nsl_i2c.i2c
    - nsl_i2c.transactor
    - nsl_i2c.clocked
    - nsl_bnoc.framed
    - nsl_video.pixel_stream
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_simulation.control
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

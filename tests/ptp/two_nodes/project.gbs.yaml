name: ptp_two_nodes

root:
  name: top
  deps:
    - nsl_data.bytestream
    - nsl_data.endian
    - nsl_data.text
    - nsl_simulation.assertions
    - nsl_simulation.logging
    - nsl_simulation.driver
    - nsl_amba.axi4_stream
    - nsl_math.int_ext
    - nsl_math.fixed
    - nsl_inet.mac
    - nsl_inet.stream
    - nsl_inet.stream_mac
    - nsl_inet.stream_ethernet
    - nsl_mii.mii
    - nsl_mii.flit
    - nsl_mii.timestamping
    - nsl_time.timestamp
    - nsl_time.clock
    - nsl_time.capture
    - nsl_time.skew
    - nsl_time.discipline
    - nsl_ptp.ptp
    - nsl_ptp.stream_l2
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

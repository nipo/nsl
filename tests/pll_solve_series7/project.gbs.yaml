name: pll_solve_series7

root:
  name: top
  deps:
    - nsl_clocking.pll
    - nsl_simulation.control
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: xilinx
      target_part: xc7a35t
      target_speed: "-1"
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

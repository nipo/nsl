name: ext_ram_sram_controller

root:
  name: top
  deps:
    - nsl_ext_ram.sram
    - nsl_ext_ram.simulation
    - nsl_ext_ram.part
    - nsl_ext_ram.timing
    - nsl_ext_ram.burst
    - nsl_io.io
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_simulation.control
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

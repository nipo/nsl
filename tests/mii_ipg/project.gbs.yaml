name: mii_ipg

root:
  name: top
  deps:
   - nsl_simulation.driver
   - nsl_amba.axi4_stream
   - nsl_mii.flit
  sources:
    - file_type: vhdl
      files:
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    simulation:
      success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

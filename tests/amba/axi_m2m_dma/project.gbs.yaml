name: amba_axi_m2m_dma

root:
  name: top
  deps:
    - nsl_amba.apb
    - nsl_amba.axi4_mm
    - nsl_amba.axi_m2m_dma
    - nsl_amba.mm_routing
    - nsl_amba.address
    - nsl_amba.ram
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_simulation.driver
    - nsl_simulation.logging
  sources:
    - file_type: vhdl
      files:
        - src/dma_vector.pkg.vhd
        - src/dma_vectors_1ch_32b.vhd
        - src/dma_vectors_2ch_32b.vhd
        - src/dma_vectors_2ch_64b.vhd
        - src/dma_vectors_4ch_32b.vhd
        - src/harness.vhd
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

name: amba_mm_traffic

root:
  name: top
  deps:
    - nsl_amba.mm_traffic
    - nsl_amba.axi4_mm
    - nsl_amba.ram
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_simulation.control
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

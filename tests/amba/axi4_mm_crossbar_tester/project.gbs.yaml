name: amba_axi4_mm_crossbar_tester

root:
  name: top
  deps:
    - nsl_amba.mm_traffic
    - nsl_amba.mm_routing
    - nsl_amba.address
    - nsl_amba.axi4_mm
    - nsl_xilinx.ps7
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_simulation.control
  sources:
    - file_type: vhdl
      files:
        - ../mm_traffic_pipelined/src/slave.vhd
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log

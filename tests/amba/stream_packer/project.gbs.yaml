name: amba_stream_packer

root:
  name: top
  deps:
    - nsl_amba.axi4_stream
    - nsl_amba.stream_processing
    - nsl_data.bytestream
    - nsl_data.prbs
    - nsl_data.text
    - nsl_simulation.assertions
    - nsl_simulation.logging
    - nsl_simulation.driver
  sources:
    - file_type: vhdl
      files:
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    outputs:
      - type: simulation-log
        path: simulation.log

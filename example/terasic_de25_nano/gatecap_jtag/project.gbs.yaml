name: de25_nano_gatecap_jtag

repositories:
  # The gatecap gateware library, and the rack this design describes.
  - path: ../../../../gatecap/gateware/lib/repository.gbs.yaml
    loader: yaml
  - path: description.yaml
    loader: gatecap-description

root:
  name: top
  deps:
    - nsl_clocking.async
    - nsl_clocking.distribution
    - nsl_clocking.reset
    - gatecap_generated.de25_nano_jtag
  sources:
    - file_type: vhdl
      files:
        - src/boundary.vhd
    - file_type: quartus-pin-assignment
      files:
        - pins.tcl
    - file_type: quartus-sdc
      files:
        - clocks.sdc

output:
  - name: synthesis
    topcell: boundary
    target:
      part: A5EB013BB23BE4SCS
    backend_config:
      gbs.builtin.quartus:
        tool: quartus-pro:25.3.1
    outputs:
      - type: bitstream
        path: gatecap_jtag.sof
      - type: quartus-rbf
        path: gatecap_jtag.rbf
      - type: synthesis-report
        path: synthesis-report.html
      - type: pnr-report
        path: pnr-report.html

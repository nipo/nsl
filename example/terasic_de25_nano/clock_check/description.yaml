# Rack of the DE25-Nano's clock bench.
#
# Three things are read here and none can be read any other way on
# this board: the rates the PLL actually came up at, the rate of the
# internal oscillator, which the data sheet does not state, and
# whether the DDR output block really moves a pin.
name: de25_nano_clock_check.de25_nano_clock_check_core

communication:
  mode: jtag
  # The transport's system side and every instrument ride the board
  # oscillator rather than anything measured here, so a rack that
  # answers says nothing about the PLL or the internal oscillator.
  clock: rates.ref

instruments:
  rates: !clock-measurer
    reference: ref
    frequency: 50_000_000
    # pll0 and pll1 are two PLL outputs as the fabric sees them.
    # internal is the SDM oscillator.  loopback is pll0 after a DDR
    # output block, a pin and an input buffer, so it is the pin that
    # is being counted rather than a net.
    clocks: [pll0, pll1, internal, loopback]
    max_rate: 500_000_000

  panel: !control-status
    clock: clock

    control:
      # Holds the DDR output's two halves at the same value, so the
      # pin stops.  The rate measured on the loopback then drops to
      # nothing, which is what tells a pin being driven by the block
      # from a pin the measurer is reading some other net on.
      still: 1
      led:
        width: 7

    status:
      # PLL lock, as the oscillator's domain sees it.
      locked: 1
      # Free running off the 50 MHz pin: a readback that does not move
      # says the design is not clocked, whatever else answers.
      ticks:
        width: 32

    # A control/status instrument with no tick at all hands Quartus a
    # zero-length array generic, which it refuses.
    tick-out:
      - [ ping ]

    tick-in:
      - [ ping_count ]

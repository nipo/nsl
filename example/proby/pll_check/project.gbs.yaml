name: proby_pll_check

root:
  name: top
  deps:
    - nsl_clocking.pll
    - nsl_clocking.async
    - nsl_clocking.distribution
    - nsl_hwdep.reset
    - gatecap_generated.pll_check
  sources:
    - file_type: vhdl
      files:
        - src/boundary.vhd
    - file_type: xilinx-ucf
      files:
        - ../pinout/clk.ucf
        - ../pinout/user.ucf

output:
  - name: synthesis
    topcell: boundary
    target:
      part: xc6slx9-2tqg144
    outputs:
      - type: bitstream
        path: pll_check.bit
      - type: ise-timing-report
        path: timing.rpt

repositories:
  - path: description.yaml
    loader: gatecap-description
  - path: ../../../../gatecap/gateware/lib/repository.gbs.yaml
    loader: yaml

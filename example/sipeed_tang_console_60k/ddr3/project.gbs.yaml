name: tang_console_60k_ddr3

repositories:
  # The gatecap gateware library, and the rack this design describes.
  - path: ../../../../gatecap/gateware/lib/repository.gbs.yaml
    loader: yaml
  - path: description.yaml
    loader: gatecap-description

root:
  name: top
  deps:
    - nsl_clocking.pll
    - nsl_clocking.async
    - nsl_clocking.distribution
    - nsl_clocking.reset
    - nsl_io.delay
    - nsl_io.io
    - nsl_io.serdes
    - nsl_io.diff
    - nsl_amba.axi4_mm
    - nsl_amba.axi4_stream
    - nsl_amba.mm_fifo
    - nsl_amba.mm_traffic
    - nsl_data.bytestream
    - nsl_logic.bool
    - nsl_ext_ram.ddr3
    - nsl_ext_ram.ddr3_io
    - nsl_ext_ram.dram
    - nsl_ext_ram.frontend
    - nsl_ext_ram.part
    - nsl_ext_ram.timing
    - nsl_bnoc.axi_adapter
    - nsl_bnoc.chunked_link
    - nsl_bnoc.framed
    - nsl_bnoc.pipe
    - nsl_usb.func
    - nsl_usb.io
    - nsl_usb.usb
    - nsl_usb.utmi
    - gatecap_generated.ddr3_walk
  sources:
    # The soft high-speed PHY the board's own USB2 port is reached
    # through, from the gatecap tree where it is maintained.
    - file_type: verilog
      files:
        - ../../../../gatecap/gateware/example/tang_console/phy/usb2_0_softphy.v
    - file_type: vhdl
      files:
        - ../../../../gatecap/gateware/example/tang_console/phy/softphy.pkg.vhd
        - ../../../../gatecap/gateware/example/tang_console/phy/gw_usb2_phy.vhd
        - src/boundary.vhd
    - file_type: gowin-cst
      files:
        - ../pinout/clk.cst
        - ../pinout/ddr3_walk.cst
        - ../../../../gatecap/gateware/example/tang_console/constraint/usb2.cst
    - file_type: gowin-sdc
      files:
        - ../pinout/clk.sdc
        # After the board clock: the four the memory block makes are
        # derived from it and none of them is stated by the netlist.
        - clocks.sdc

output:
  - name: synthesis
    topcell: boundary
    target:
      part: GW5AT-LV60PG484AC1/I0#B
      use_as_gpio:
        - sspi
        - done
        - ready
        - cpu
      options:
        # This design has eight real clocks and a part with eight
        # primary global resources, and the bench's walkers each reset
        # a few hundred registers off one net.  Left alone the placer
        # promotes those resets into the primaries, spends the budget
        # on the bench and re-places the whole device around it, which
        # is what makes a reading of this design's timing unrepeatable.
        # Replicating a high-fanout driver into several lower-fanout
        # ones takes the argument for promoting them away.
        replicate_resources: 1
        # Gowin's own default on the larger Arora V parts.
        place_option: 3
    outputs:
      - type: gowin-fs
        path: ddr3.fs

name: tang_console_60k_ptp_client

root:
  name: top
  deps:
    - nsl_clocking.distribution
    - nsl_clocking.pll
    - nsl_clocking.async
    - nsl_clocking.interdomain
    - nsl_clocking.reset
    - nsl_sipeed.pmod_ethernet
    - nsl_icesugar.pmod_lcd_096
    - nsl_usb.io
    - nsl_digilent.pmod
    - nsl_mii.flit
    - nsl_mii.timestamping
    - nsl_amba.axi4_stream
    - nsl_amba.stream_fifo
    - nsl_inet.mac
    - nsl_inet.stream
    - nsl_inet.stream_mac
    - nsl_inet.stream_ethernet
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_math.arith
    - nsl_math.fixed
    - nsl_time.timestamp
    - nsl_time.clock
    - nsl_time.capture
    - nsl_time.pps
    - nsl_time.discipline
    - nsl_time.calendar
    - nsl_ptp.ptp
    - nsl_ptp.stream_l2
    - nsl_video.mode
    - nsl_video.pixel_stream
    - nsl_video.terminal
    - nsl_video.colormap
    - nsl_indication.font_6x8
    - nsl_color.rgb
    - gatecap_generated.observer
  sources:
    - file_type: vhdl
      files:
        - src/screen.pkg.vhd
        - src/screen_text.vhd
        - src/boundary.vhd
    - file_type: gowin-cst
      files:
        - ../pinout/clk.cst
        - ../pinout/usb_fs.cst
        - ../pinout/done_led.cst
        - ../pinout/ready_led.cst
        - ../pinout/j7_pmod_double_lvcmos33.cst
        - ../pinout/pps_a21.cst
        - j6_pmod_ethernet.cst
    - file_type: gowin-sdc
      files:
        - ../pinout/clk.sdc
        - timing.sdc

output:
  - name: synthesis
    topcell: boundary
    target:
      part: GW5AT-LV60PG484AC1/I0#B
      use_as_gpio:
        - sspi
        - done
        - ready
        - cpu
    outputs:
      - type: gowin-fs
        path: ptp_client.fs
      - type: synthesis-report
        path: synthesis-report.html
      - type: pnr-report
        path: pnr-report.html

repositories:
  - path: description.yaml
    loader: gatecap-description
  - path: ../../../../gatecap/gateware/lib/repository.gbs.yaml
    loader: yaml

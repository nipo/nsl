# Rack of the CYC1000's JTAG gatecap bench.
#
# The transport rides the part's own TAP, on the FT2232H's first
# channel, through the USER0 chain.  It crosses from TCK to the board
# oscillator in its own FIFOs; the 12 MHz pin clocks the transport's
# system side, the instruments and the user logic alike.
name: tei0003_jtag.tei0003_jtag_core

communication:
  mode: jtag
  clock: rates.ref

instruments:
  # The next rung on this board is a PLL, and this is the instrument
  # that will say whether it came up at the rate it was asked for.  For
  # now it watches the oscillator against itself: the answer is known
  # in advance, which is what makes it a check that the block, the
  # transport and the clock are all running.
  rates: !clock-measurer
    reference: ref
    frequency: 12_000_000
    clocks: [board]
    # Headroom for the clocks a PLL will make on this board.
    max_rate: 200_000_000

  panel: !control-status
    clock: clock

    control:
      # Written by the host and read straight back through the status
      # word below, so a round trip crosses the register file rather
      # than turning around in the host or on the wire.
      scratch:
        width: 32
      # Secondary sanity light: LED1 to LED7.  LED8 is not on the
      # panel, it is the counter's own heartbeat, so the board says
      # whether it is clocked before any host has talked to it.
      led:
        width: 7

    status:
      # The control word above, as the fabric holds it.
      scratch_back:
        width: 32
      # Free running off the 12 MHz pin.  A readback that does not move
      # says the design is not clocked, whatever else answers.
      ticks:
        width: 32
      button: 1

    # Wired to one another in the fabric, so a strobe the host sends
    # comes back as a count the host reads.  The panel would carry
    # neither otherwise, and a control/status instrument with no tick
    # at all hands Quartus a zero-length array generic, which it
    # refuses (see ../gatecap_uart/readme.rst).
    tick-out:
      - [ ping ]

    tick-in:
      - [ ping_count ]

name: tei0003_clock_check

repositories:
  - path: ../../../../gatecap/gateware/lib/repository.gbs.yaml
    loader: yaml
  - path: description.yaml
    loader: gatecap-description

root:
  name: top
  deps:
    - nsl_clocking.async
    - nsl_clocking.distribution
    - nsl_clocking.pll
    - nsl_hwdep.reset
    - nsl_io.ddr
    - nsl_io.io
    - gatecap_generated.tei0003_clock_check
  sources:
    - file_type: vhdl
      files:
        - src/boundary.vhd
    - file_type: quartus-pin-assignment
      files:
        - pins.tcl
    - file_type: quartus-sdc
      files:
        - clocks.sdc

output:
  - name: synthesis
    topcell: boundary
    target:
      part: 10CL025YU256C8G
    backend_config:
      gbs.builtin.quartus:
        tool: quartus-prime
    outputs:
      - type: bitstream
        path: clock_check.sof
      - type: quartus-rbf
        path: clock_check.rbf
      - type: synthesis-report
        path: synthesis-report.html
      - type: pnr-report
        path: pnr-report.html

name: pll_check.pll_check_core

communication:
  mode: jtag

instruments:
  # Every generated rate, against the board crystal.  A wrong divider
  # shows up here; a wrong reference would scale all of them alike,
  # which is why the reference is the crystal and not a PLL output.
  rates: !clock-measurer
    reference: board
    frequency: 125_000_000
    clocks: [p0, p90, p180, p270, rack, sample, f150m, f50m, f25m, f10m]
    max_rate: 200_000_000

  # The four phase-shifted clocks, sampled raw by a clock from the
  # other block.  87.5MHz against 12MHz is 175 over 24, so the
  # sampling instant walks the whole output cycle in 175 steps before
  # repeating: an edge resolves to a 175th of a cycle, two degrees.
  phases: !logic-analyzer
    storage:
      # 16384 samples is 187us, ninety-odd walks of the grid.  Byte
      # lane packing would pay for itself at four signals, but the
      # packed buffer's byte-enabled memory does not infer as block
      # ram without a registered output, so the plain one it is.
      buffer_depth_l2: 14

    capture:
      max_windows: 1

    trigger:
      capabilities: edge

    domains:
      sample:
        clock: clock
        frequency: 87_500_000

        signals:
          p0:
            trigger: true
          p90:
            trigger: false
          p180:
            trigger: false
          p270:
            trigger: false

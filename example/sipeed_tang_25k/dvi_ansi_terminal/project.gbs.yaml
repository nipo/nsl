name: tang_25k_dvi_ansi_terminal

root:
  name: top
  deps:
    - nsl_digilent.pmod
    - nsl_sipeed.pmod_dvi
    - nsl_clocking.async
    - nsl_clocking.distribution
    - nsl_dvi.transceiver
    - nsl_dvi.encoder
    - nsl_dvi.terminal
    - nsl_terminal.ansi
    - nsl_indication.font_6x8
    - nsl_hwdep.clock
    - nsl_hwdep.reset
    - nsl_io.io
    - nsl_io.clock
    - nsl_io.diff
    - nsl_math.arith
    - nsl_color.rgb
    - nsl_uart.serdes
    - nsl_memory.fifo
    - nsl_usb.hid_host
    - nsl_usb.io
    - nsl_amba.axi4_stream
    - nsl_clocking.pll
    - nsl_logic.bool
    - nsl_data.bytestream
  sources:
    - file_type: vhdl
      files:
        - src/stage1_pll_mod.vhd
        - src/stage1_pll.vhd
        - src/dvi_pll_mod.vhd
        - src/dvi_pll.vhd
        - src/top.pkg.vhd
        - src/boundary.vhd
        - src/main.vhd
    - file_type: verilog
      files:
        - src/stage1_pll_init.v
        - src/dvi_pll_init.v
    - file_type: gowin-cst
      files:
        - ../pinout/j4_pmod_single_lvcmos33d.cst
        - ../pinout/done_led.cst
        - ../pinout/ready_led.cst
        - ../pinout/buttons.cst
        - ../pinout/clk.cst
        - ../pinout/uart.cst
        - ../pinout/usb_host.cst
    - file_type: gowin-sdc
      files:
        - ../pinout/clk.sdc
        - src/clocks.sdc

output:
  - name: synthesis
    topcell: boundary
    require_backends:
      - gbs.builtin.gowin
    target:
      part: GW5A-LV25MG121NC1/I0#A
      use_as_gpio:
        - sspi
        - done
        - ready
        - cpu
    outputs:
      - type: gowin-fs
        path: dvi_ansi_terminal.fs

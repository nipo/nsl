name: tang_25k_usb_keyboard

root:
  name: top
  deps:
    - nsl_usb.hid_host
    - nsl_usb.io
    - nsl_amba.axi4_stream
    - nsl_icesugar.pmod_lcd_096
    - nsl_dvi.terminal
    - nsl_indication.font_6x8
    - nsl_color.rgb
    - nsl_data.text
    - nsl_data.bytestream
    - nsl_digilent.pmod
    - nsl_clocking.distribution
    - nsl_clocking.async
    - nsl_clocking.pll
    - nsl_hwdep.reset
  sources:
    - file_type: vhdl
      files:
        - src/boundary.vhd
    - file_type: gowin-cst
      files:
        - ../pinout/j4_pmod_double_lvcmos33.cst
        - ../pinout/clk.cst
        - ../pinout/done_led.cst
        - ../pinout/usb_host.cst
    - file_type: gowin-sdc
      files:
        - ../pinout/clk.sdc

output:
  - name: synthesis
    topcell: boundary
    require_backends:
      - gbs.builtin.gowin
    target:
      part: GW5A-LV25MG121NC1/I0#A
      use_as_gpio:
        - sspi
        - done
        - ready
        - cpu
    outputs:
      - type: gowin-fs
        path: usb_keyboard.fs

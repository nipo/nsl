name: tang_25k_dvi_terminal

root:
  name: top
  deps:
    - nsl_video.mode
    - nsl_video.pixel_stream
    - nsl_digilent.pmod
    - nsl_sipeed.pmod_dvi
    - nsl_sipeed.pmod_btn_4_4
    - nsl_clocking.async
    - nsl_clocking.distribution
    - nsl_event.tick
    - nsl_clocking.pll
    - nsl_dvi.transceiver
    - nsl_video.pattern
    - nsl_dvi.encoder
    - nsl_video.terminal
    - nsl_indication.font_6x8
    - nsl_clocking.reset
    - nsl_io.io
    - nsl_io.clock
    - nsl_io.diff
    - nsl_logic.bool
    - nsl_math.fixed
    - nsl_signal_generator.trigonometry
    - nsl_uart.serdes
  sources:
    - file_type: vhdl
      files:
        - src/top.pkg.vhd
        - src/boundary.vhd
        - src/main.vhd
    - file_type: gowin-cst
      files:
        - ../pinout/j4_pmod_single_lvcmos33d.cst
        - ../pinout/j5_pmod_double_lvcmos33_in.cst
        - ../pinout/done_led.cst
        - ../pinout/ready_led.cst
        - ../pinout/buttons.cst
        - ../pinout/clk.cst
        - ../pinout/uart.cst
    - file_type: gowin-sdc
      files:
        - ../pinout/clk.sdc
        - src/clocks.sdc

output:
  - name: synthesis
    topcell: boundary
    require_backends:
      - gbs.builtin.gowin
    target:
      part: GW5A-LV25MG121NC1/I0#A
      use_as_gpio:
        - sspi
        - done
        - ready
        - cpu
    outputs:
      - type: gowin-fs
        path: dvi_terminal.fs

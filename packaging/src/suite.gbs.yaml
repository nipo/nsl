name: nsl-packaging
description: NSL IP Packaging

settings:
  max_parallel_projects: 4
  stop_on_failure: false
  output:
    junit_xml: build-results/junit.xml
    summary_json: build-results/summary.json
    log_dir: build-results/logs
    save_logs: true

projects:
  - name: framed
    path: interface/framed
    tags: [vivado-interface]
  - name: opendrain
    path: interface/opendrain
    tags: [vivado-interface]
  - name: phc_timestamp
    path: interface/phc_timestamp
    tags: [vivado-interface]

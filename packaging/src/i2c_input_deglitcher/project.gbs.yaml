name: i2c_input_deglitcher

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - ip_top.vhd
  deps:
    - nsl_i2c.i2c

output:
  - name: ip_package
    topcell: ip_top
    target:
      part: xc7z020clg400-1
    backend_config:
      gbs.builtin.vivado-ip:
        tool: vivado
        vendor: nsl
        library: i2c
        name: i2c_input_deglitcher
        version: "1.0"
        taxonomy: /I2C/Utility
        display_name: I2C Input deglitcher
        description: I2C line filter
        supported_families:
          - zynq
          - artix7
    outputs:
      - type: vivado-ip-zip
        path: i2c_input_deglitcher_1.0.zip

name: gmii_z7_phy

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - gmii_z7_phy_ip_top.vhd
  deps:
    - nsl_bnoc.committed
    - nsl_bnoc.framed
    - nsl_mii.gmii

output:
  - name: ip_package
    topcell: gmii_z7_phy_ip_top
    target:
      part: xc7z020clg400-1
    backend_config:
      gbs.builtin.vivado-ip:
        tool: vivado
        vendor: nsl
        library: mii
        name: gmii_z7_phy
        version: "1.0"
        taxonomy: /NSL/Mii
        display_name: GMII Zynq-7 Phy
        description: Pseudo GMII phy for the Zynq-7 hard GbE controller, exposing layer-1 frames as AXI4-Stream
        supported_families:
          - zynq
          - artix7
    outputs:
      - type: vivado-ip-zip
        path: gmii_z7_phy_1.0.zip

name: framed_i2c_controller

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - ip_top.vhd
    - file_type: vivado-bus-zip
      files: [../interface/framed/framed.zip]
  deps:
   - nsl_bnoc.framed
   - nsl_i2c.transactor

output:
  - name: ip_package
    topcell: ip_top
    target:
      part: xc7z020clg400-1
    backend_config:
      gbs.builtin.vivado-ip:
        tool: vivado
        vendor: nsl
        library: i2c
        name: framed_i2c_controller
        version: "1.0"
        taxonomy: /I2C/Transactor
        display_name: Framed I2C Master
        description: A I2C Master using a framed network
        supported_families:
          - zynq
          - artix7
    outputs:
      - type: vivado-ip-zip
        path: framed_i2c_controller_1.0.zip
